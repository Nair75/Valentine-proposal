<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>For You ❤️</title>

<style>
body {
    margin: 0;
    overflow: hidden;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    text-align: center;
    color: white;
    background-color: #1a0a0f;

    /* Perfect Centering */
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

/* Romantic Pink/Red Background */
body::before {
    content: "";
    position: fixed;
    inset: 0;
    background:
        linear-gradient(135deg, rgba(255, 20, 100, 0.3), rgba(139, 0, 66, 0.5)),
        radial-gradient(circle at 20% 50%, rgba(255, 105, 180, 0.2) 0%, transparent 50%),
        radial-gradient(circle at 80% 50%, rgba(220, 20, 60, 0.2) 0%, transparent 50%),
        linear-gradient(to bottom, #0a0a0a, #1a0511);
    z-index: -2;
}

/* Animated Background Hearts */
.bg-heart {
    position: absolute;
    font-size: 40px;
    opacity: 0.15;
    animation: bgFloat 20s ease-in-out infinite;
    pointer-events: none;
    z-index: -1;
}

@keyframes bgFloat {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(-50px) rotate(15deg); }
}

/* Polaroid Photo Snippets - Multiple Photos */
.snippet {
    position: absolute;
    background-size: cover;
    background-position: center;
    width: 120px;
    height: 140px;
    padding: 10px;
    background-clip: content-box;
    border: 8px solid white;
    border-bottom: 25px solid white;
    border-radius: 8px;
    box-shadow: 0 15px 35px rgba(255, 20, 100, 0.4);
    opacity: 0.7;
    animation: floatSnippet 12s ease-in-out infinite alternate;
}

.snippet1 { background-image: url("photo1.jpg"); }
.snippet2 { background-image: url("photo2.jpg"); }
.snippet3 { background-image: url("photo3.jpg"); }
.snippet4 { background-image: url("photo4.jpg"); }
.snippet5 { background-image: url("photo5.jpg"); }

@keyframes floatSnippet {
    from { transform: translateY(40px) rotate(-8deg); }
    to { transform: translateY(-40px) rotate(8deg); }
}

/* Glass Card with Pink Glow */
.card {
    position: relative;
    transform: scale(1);
    background: rgba(255, 255, 255, 0.1);
    padding: 50px 40px;
    border-radius: 25px;
    backdrop-filter: blur(20px);
    box-shadow: 
        0 0 60px rgba(255, 20, 100, 0.5),
        0 0 100px rgba(255, 105, 180, 0.3),
        inset 0 0 20px rgba(255, 255, 255, 0.1);
    border: 1px solid rgba(255, 105, 180, 0.3);
    width: 85%;
    max-width: 450px;
    transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    z-index: 10;
}

h2 {
    margin-top: 0;
    font-size: 28px;
    text-shadow: 0 0 20px rgba(255, 105, 180, 0.8);
    letter-spacing: 1px;
}

button {
    padding: 14px 35px;
    margin: 15px 10px;
    border: none;
    border-radius: 30px;
    font-size: 18px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s ease;
    box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
}

.yes {
    background: linear-gradient(135deg, #ff1493, #ff69b4);
    color: white;
    box-shadow: 0 5px 25px rgba(255, 20, 147, 0.5);
}

.yes:hover {
    transform: scale(1.15);
    box-shadow: 0 8px 35px rgba(255, 20, 147, 0.7);
}

.no {
    background: white;
    color: #ff1493;
    border: 2px solid #ff69b4;
}

.no:hover {
    transform: scale(1.1);
    background: #fff0f5;
}

/* Floating Hearts Animation */
.heart {
    position: absolute;
    font-size: 25px;
    animation: floatHearts 7s ease-in-out infinite;
    opacity: 0.9;
    pointer-events: none;
    filter: drop-shadow(0 0 10px rgba(255, 105, 180, 0.8));
}

@keyframes floatHearts {
    0% { transform: translateY(0) scale(1); opacity: 0.9; }
    50% { transform: translateY(-70px) scale(1.2); opacity: 1; }
    100% { transform: translateY(-140px) scale(0.8); opacity: 0; }
}

/* Sparkle Effect */
.sparkle {
    position: absolute;
    width: 4px;
    height: 4px;
    background: white;
    border-radius: 50%;
    box-shadow: 0 0 10px #fff, 0 0 20px #ff69b4;
    animation: sparkle 2s ease-in-out infinite;
    pointer-events: none;
}

@keyframes sparkle {
    0%, 100% { opacity: 0; transform: scale(0); }
    50% { opacity: 1; transform: scale(1); }
}

/* Final Message Styling */
.final-message {
    font-size: 36px;
    animation: pulse 2s ease-in-out infinite;
}

@keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.05); }
}

</style>
</head>

<body>

<!-- Background Hearts -->
<div class="bg-heart" style="left: 10%; top: 15%;">💖</div>
<div class="bg-heart" style="left: 85%; top: 25%; animation-delay: 2s;">❤️</div>
<div class="bg-heart" style="left: 15%; top: 75%; animation-delay: 4s;">💕</div>
<div class="bg-heart" style="left: 80%; top: 70%; animation-delay: 6s;">💗</div>

<!-- Main Card -->
<div class="card" id="questionBox">
    <h2>Will you be my valentine? 💕</h2>
    <button class="yes" onclick="nextQuestion()">Yes! 💖</button>
    <button class="no" onclick="moveButton(this)">No 😢</button>
</div>

<script>

let zoomLevel = 1;
let step = 1;

/* Generate Polaroid Snippets - Multiple photos with random selection */
function createSnippet() {
    const snippet = document.createElement("div");
    snippet.classList.add("snippet");
    
    // Randomly pick one of the 5 photos
    const photoNumber = Math.floor(Math.random() * 5) + 1;
    snippet.classList.add("snippet" + photoNumber);
    
    snippet.style.left = Math.random() * 90 + 5 + "vw";
    snippet.style.top = Math.random() * 90 + 5 + "vh";
    snippet.style.animationDuration = (Math.random() * 6 + 10) + "s";
    snippet.style.animationDelay = Math.random() * 2 + "s";
    document.body.appendChild(snippet);
    setTimeout(() => snippet.remove(), 18000);
}

// Create initial 5 snippets immediately
for (let i = 0; i < 5; i++) {
    setTimeout(() => createSnippet(), i * 300);
}

// Keep creating more snippets to maintain 4-5 on screen
setInterval(() => {
    createSnippet();
}, 3500);

/* Generate Floating Hearts */
setInterval(() => {
    const heart = document.createElement("div");
    heart.classList.add("heart");
    const hearts = ["💖", "💕", "❤️", "💗", "💓"];
    heart.innerHTML = hearts[Math.floor(Math.random() * hearts.length)];
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.bottom = "0";
    heart.style.animationDuration = (Math.random() * 3 + 5) + "s";
    document.body.appendChild(heart);
    setTimeout(() => heart.remove(), 8000);
}, 800);

/* Generate Sparkles */
setInterval(() => {
    const sparkle = document.createElement("div");
    sparkle.classList.add("sparkle");
    sparkle.style.left = Math.random() * 100 + "vw";
    sparkle.style.top = Math.random() * 100 + "vh";
    sparkle.style.animationDuration = (Math.random() * 1 + 1.5) + "s";
    document.body.appendChild(sparkle);
    setTimeout(() => sparkle.remove(), 3000);
}, 300);

/* No Button Multiplies Yes Buttons */
let yesCount = 0;

function moveButton(btn) {
    // Create a new Yes button
    yesCount++;
    
    const newYes = document.createElement("button");
    newYes.className = "yes";
    newYes.textContent = "Yes! 💖";
    newYes.onclick = nextQuestion;
    
    // Random position
    newYes.style.position = "fixed";
    newYes.style.left = Math.random() * 70 + 15 + "vw";
    newYes.style.top = Math.random() * 70 + 15 + "vh";
    newYes.style.zIndex = "1000";
    
    // Entrance animation
    newYes.style.transform = "scale(0)";
    newYes.style.transition = "transform 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55)";
    
    document.body.appendChild(newYes);
    
    // Animate in
    setTimeout(() => {
        newYes.style.transform = "scale(1)";
    }, 10);
    
    // Make No button shake in frustration
    btn.style.animation = "shake 0.5s";
    
    // Add funny messages as more Yes buttons appear
    if (yesCount === 3) {
        alert("You sure you want to say no? 🤔");
    } else if (yesCount === 5) {
        alert("The universe is telling you something... 😏");
    } else if (yesCount === 8) {
        alert("Just accept it already! 😂💕");
    }
}

// Add shake animation to CSS
const style = document.createElement('style');
style.textContent = `
    @keyframes shake {
        0%, 100% { transform: translateX(0); }
        25% { transform: translateX(-10px) rotate(-5deg); }
        75% { transform: translateX(10px) rotate(5deg); }
    }
`;
document.head.appendChild(style);

/* Zoom Animation */
function updateZoom() {
    document.getElementById("questionBox").style.transform = `scale(${zoomLevel})`;
}

/* Question Flow */
function nextQuestion() {
    step++;
    zoomLevel += 0.35;
    updateZoom();

    const box = document.getElementById("questionBox");

    if (step === 2) {
        box.innerHTML = `
            <h2>Are you really sure? 🥰💘</h2>
            <button class="yes" onclick="nextQuestion()">Yes, I'm sure! 💕</button>
            <button class="no" onclick="moveButton(this)">No 😅</button>
        `;
    } 
    else if (step === 3) {
        box.innerHTML = `
            <h2>Like REALLY really sure? 😍💖</h2>
            <button class="yes" onclick="nextQuestion()">Absolutely yes! ❤️</button>
            <button class="no" onclick="moveButton(this)">Wait... 😭</button>
        `;
    } 
    else if (step === 4) {
        zoomLevel += 0.6;
        updateZoom();

        box.innerHTML = `
            <h2 class="final-message">
                Yay! You're mine now! 💖✨
            </h2>
            <p style="font-size: 22px; margin-top: 25px; opacity: 0.95; line-height: 1.6;">
                This will be your last Valentine as my GF... ❤️
            </p>
            <p style="font-size: 18px; margin-top: 15px; opacity: 0.9;">
                Because next time, you'll be my Wife! 💍✨
            </p>
        `;
        
        // Extra celebration hearts
        for (let i = 0; i < 30; i++) {
            setTimeout(() => {
                const heart = document.createElement("div");
                heart.classList.add("heart");
                heart.innerHTML = "💖";
                heart.style.left = Math.random() * 100 + "vw";
                heart.style.bottom = "0";
                heart.style.fontSize = Math.random() * 20 + 20 + "px";
                document.body.appendChild(heart);
                setTimeout(() => heart.remove(), 8000);
            }, i * 100);
        }
    }
}

</script>

</body>
</html>
